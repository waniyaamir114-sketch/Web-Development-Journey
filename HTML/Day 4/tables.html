    <title>HTML Tables</title>
</head>
<body>

      </tr>

       <tr>
         <td style="padding:5px";>Sara</td>

      </tr>

       <tr>
         <td style="padding:5px";>Ahmad</td>
         <td style="padding:5px";>CSS</td>
         <td style="padding:5px";>49/50</td>
      </tr>


</table>

</body>
</html>
