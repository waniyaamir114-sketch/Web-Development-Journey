<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width,initial-scale=0.1">
        <title>Day 5 - HTML Forms</title>
    </head>
<body>
        <h1>RESULT CARD:</h1>
        <hr>
        <form>
            <label for="name">Full Name:</label>
            <input type="text" id="name"
            placeholder="Enter your full name"required>

            <br><br>

            <label for="father">Father name:</label>
            <input type="text" id="father"
            placeholder="Enter your father name "required>

            <br><br>

            <label for="roll">Roll num:</label>
            <input type="number" id="roll"
            placeholder="Enter your roll number"required>
            
            <br><br>

            <label for="Class">Class:</label>
            <input type="text" id="class"
            placeholder="Enter your class "required>

             <br><br>

            <label for="section">Section:</label>
            <input type="section" id="section"
            placeholder="Enter your Section"required>

            <br><br>

            <label for="Marks">English marks:</label>
            <input type="number" id="marks"
            placeholder="Enter your english marks"required>

           <br><br>

            <label for="marks">Math marks:</label>
            <input type="number" id="marks"
            placeholder="Enter your math marks"required>

            <br><br>

            <label for="marks">Urdu marks:</label>
            <input type="number" id="marks"
            placeholder="Enter your urdu marks"required>

            <br><br>

            <label for="Total marks">Total marks:</label>
            <input type="number" id="total marks"
            placeholder="Enter your total marks"required>
            
            <br><br>

            <label for="percentage">Percentage:</label>
            <input type="number" id="percentage"
            placeholder="Enter your percentage"required>

            <br><br>

            <label for="Grade">Grade:</label>
            <input type="Grade" id="grade"
            placeholder="Enter your Grade"required>

            <br><br> 
            <input type="Submit" value="Submit">

        </form>
</body>
</html>
